<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#f97316">
  <title>FreshCorner — Commander</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800;9..40,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.14.0/dist/tabler-icons.min.css">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg0:#0a0a0a;--bg1:#111;--bg2:#1a1a1a;--bg3:#222;
      --t1:#f2f2f2;--t2:#888;--t3:#444;
      --orange:#f97316;--orange-d:#7c3400;--orange-bg:#1a0900;--orange-glow:rgba(249,115,22,.15);
      --green:#22c55e;--green-d:#14532d;--green-bg:#052010;
      --border:rgba(255,255,255,.06);--border2:rgba(255,255,255,.1);
      --r:12px;--rsm:8px;--nav-h:64px;
    }
    html,body{min-height:100%;background:var(--bg0);color:var(--t1);font-family:'DM Sans',system-ui,sans-serif;font-size:14px;-webkit-tap-highlight-color:transparent}
    ::-webkit-scrollbar{display:none}

    /* ── HEADER ── */
    .header{background:rgba(10,10,10,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:12px 16px;position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px}
    .header-logo{font-size:17px;font-weight:900;letter-spacing:-.5px}
    .header-logo span{color:var(--orange)}
    .cart-btn{margin-left:auto;background:var(--orange);color:#fff;border:none;border-radius:20px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px;transition:all .12s}
    .cart-btn:active{transform:scale(.95)}
    .cart-btn-badge{background:#fff;color:var(--orange);border-radius:10px;font-size:11px;font-weight:900;padding:1px 6px}

    /* ── HERO ── */
    .hero{padding:24px 16px 12px;text-align:center;background:radial-gradient(ellipse 100% 60% at 50% -10%,rgba(249,115,22,.18),transparent 60%)}
    .hero-icon{font-size:52px;display:block;margin-bottom:10px;animation:bounce 2s infinite}
    @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    .hero h1{font-size:26px;font-weight:900;letter-spacing:-1px}
    .hero h1 span{color:var(--orange)}
    .hero p{font-size:12px;color:var(--t3);margin-top:6px}
    .hero-pills{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:12px}
    .pill{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;background:var(--bg2);border:1px solid var(--border2);color:var(--t2)}

    /* ── CATALOGUE ── */
    .cats-bar{display:flex;gap:6px;overflow-x:auto;padding:10px 16px 6px;scrollbar-width:none}
    .cat-chip{padding:7px 16px;border-radius:20px;border:1px solid var(--border);background:var(--bg2);color:var(--t3);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit;flex-shrink:0;transition:all .12s}
    .cat-chip.active{background:var(--orange-bg);border-color:var(--orange-d);color:var(--orange)}
    .catalogue{padding:8px 16px 20px}
    .cat-section{margin-bottom:20px}
    .cat-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--t3);padding:6px 0 8px;border-bottom:1px solid var(--border);margin-bottom:10px;display:flex;align-items:center;gap:6px}
    .prod-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    .prod-card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r);padding:14px 12px 12px;cursor:pointer;display:flex;flex-direction:column;gap:5px;position:relative;transition:all .12s;min-height:120px;-webkit-tap-highlight-color:transparent;overflow:hidden}
    .prod-card::after{content:'';position:absolute;inset:0;background:var(--orange);opacity:0;transition:opacity .2s;pointer-events:none}
    .prod-card.flash::after{opacity:.1}
    .prod-card:active{transform:scale(.96)}
    .prod-card.in-cart{border-color:var(--orange-d)}
    .qty-badge{position:absolute;top:8px;right:8px;background:var(--orange);color:#fff;border-radius:20px;font-size:11px;font-weight:900;padding:2px 8px}
    .prod-ico{font-size:28px;line-height:1}
    .prod-nom{font-size:12px;font-weight:600;line-height:1.3;color:var(--t2);flex:1}
    .prod-prix{font-size:18px;font-weight:900;color:var(--t1);letter-spacing:-.5px}

    /* ── PANIER SHEET ── */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;display:none;backdrop-filter:blur(4px)}
    .overlay.open{display:block}
    .sheet{position:fixed;bottom:0;left:0;right:0;background:var(--bg1);border-radius:20px 20px 0 0;z-index:101;max-height:90dvh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);padding-bottom:env(safe-area-inset-bottom)}
    .sheet.open{transform:translateY(0)}
    .sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--bg3);margin:10px auto 0}
    .sheet-head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
    .sheet-head h2{font-size:15px;font-weight:800;flex:1}
    .btn-vider{background:transparent;border:none;color:var(--t3);font-size:12px;cursor:pointer;font-family:inherit}
    .sheet-body{flex:1;overflow-y:auto;padding:10px 16px;display:flex;flex-direction:column;gap:8px}
    .empty-cart{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--t3);padding:40px;text-align:center}
    .empty-cart i{font-size:42px;opacity:.15}
    .cart-item{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rsm);padding:10px 12px;display:flex;align-items:center;gap:10px}
    .ci-ico{font-size:20px;flex-shrink:0}
    .ci-info{flex:1;min-width:0}
    .ci-nom{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ci-pu{font-size:10px;color:var(--t3)}
    .ci-ctrl{display:flex;align-items:center;gap:6px}
    .qbtn{width:30px;height:30px;border-radius:8px;border:1px solid var(--border2);background:var(--bg3);color:var(--t1);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit}
    .qnum{font-size:14px;font-weight:800;min-width:22px;text-align:center}
    .ci-tot{font-size:13px;font-weight:800;color:var(--orange);min-width:46px;text-align:right;flex-shrink:0}
    .sheet-foot{padding:14px 16px;border-top:1px solid var(--border);flex-shrink:0;display:flex;flex-direction:column;gap:12px}
    .total-row{display:flex;justify-content:space-between;align-items:center}
    .total-label{font-size:13px;color:var(--t2)}
    .total-val{font-size:26px;font-weight:900;color:var(--orange);letter-spacing:-.5px}

    /* Infos client dans le panier */
    .client-fields{display:flex;flex-direction:column;gap:8px}
    .field label{display:block;font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
    .field input,.field textarea{width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--rsm);padding:11px 13px;color:var(--t1);font-size:14px;font-family:inherit;outline:none;-webkit-appearance:none;resize:none}
    .field input:focus,.field textarea:focus{border-color:var(--orange-d);box-shadow:0 0 0 3px var(--orange-glow)}

    /* Paiement */
    .pay-opts{display:flex;gap:6px}
    .pay-opt{flex:1;padding:9px 4px;border-radius:var(--rsm);border:1px solid var(--border);background:var(--bg2);color:var(--t3);font-size:11px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit;transition:all .12s}
    .pay-opt i{font-size:18px}
    .pay-opt.on{background:var(--orange-bg);border-color:var(--orange-d);color:var(--orange)}

    /* Bouton commander */
    .btn-order{width:100%;padding:15px;border-radius:var(--rsm);border:none;background:#25D366;color:#fff;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s;box-shadow:0 4px 20px rgba(37,211,102,.35)}
    .btn-order:active{transform:scale(.98)}
    .btn-order:disabled{background:var(--bg3);color:var(--t3);box-shadow:none}

    /* ── CONFIRMATION ── */
    #page-confirm{display:none;min-height:100dvh;align-items:center;justify-content:center;padding:24px;flex-direction:column;gap:16px;text-align:center}
    #page-confirm.active{display:flex}
    .confirm-icon{font-size:72px;animation:pop .4s cubic-bezier(.17,.67,.3,1.5)}
    @keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
    .confirm-title{font-size:24px;font-weight:900;letter-spacing:-.5px}
    .confirm-sub{font-size:13px;color:var(--t3);line-height:1.6;max-width:300px}
    .confirm-card{background:var(--bg1);border:1px solid var(--border2);border-radius:var(--r);padding:16px;width:100%;max-width:340px;text-align:left}
    .confirm-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--border)}
    .confirm-row:last-child{border-bottom:none}
    .confirm-row span:first-child{color:var(--t3)}
    .confirm-total{font-size:22px;font-weight:900;color:var(--orange);margin-top:4px}
    .btn-new{padding:13px 24px;border-radius:var(--rsm);border:1px solid var(--border2);background:var(--bg2);color:var(--t2);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:7px}

    /* ── TOAST ── */
    .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:var(--r);font-size:12px;font-weight:700;display:flex;align-items:center;gap:7px;z-index:999;white-space:nowrap;animation:tin .2s ease;background:var(--green-bg);border:1px solid var(--green-d);color:var(--green)}
    @keyframes tin{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
  </style>
</head>
<body>

<!-- CATALOGUE -->
<div id="page-catalogue">
  <div class="header">
    <div class="header-logo">Fresh<span>Corner</span></div>
    <button class="cart-btn" id="cart-btn" onclick="openSheet()" style="display:none">
      <i class="ti ti-shopping-cart" style="font-size:16px"></i>
      <span id="cart-btn-label">0</span>
      <span class="cart-btn-badge" id="cart-btn-total">0 €</span>
    </button>
  </div>

  <div class="hero">
    <span class="hero-icon">🧃</span>
    <h1>Fresh<span>Corner</span></h1>
    <p>Boissons & snacks livrés chez vous 🚀</p>
    <div class="hero-pills">
      <span class="pill">🛵 Livraison rapide</span>
      <span class="pill">💳 Paiement à la livraison</span>
      <span class="pill">📍 À domicile</span>
    </div>
  </div>

  <div class="cats-bar" id="cats-bar"></div>
  <div class="catalogue" id="catalogue"></div>
</div>

<!-- CONFIRMATION -->
<div id="page-confirm">
  <div class="confirm-icon">✅</div>
  <div class="confirm-title">Commande envoyée !</div>
  <div class="confirm-sub">Votre commande a été transmise au livreur via WhatsApp. Vous serez contacté pour confirmation.</div>
  <div class="confirm-card" id="confirm-recap"></div>
  <button class="btn-new" onclick="resetCommande()"><i class="ti ti-plus"></i> Nouvelle commande</button>
</div>

<!-- PANIER SHEET -->
<div class="overlay" id="overlay" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <h2>🛒 Mon panier</h2>
    <button class="btn-vider" onclick="clearCart()">Vider</button>
  </div>
  <div class="sheet-body" id="sheet-body"></div>
  <div class="sheet-foot">
    <div class="total-row">
      <span class="total-label">Total</span>
      <span class="total-val" id="total-val">0 €</span>
    </div>
    <!-- Infos client -->
    <div class="client-fields">
      <div class="field">
        <label>Votre prénom *</label>
        <input id="c-nom" type="text" placeholder="Ex: Marie" autocomplete="given-name">
      </div>
      <div class="field">
        <label>Téléphone *</label>
        <input id="c-tel" type="tel" placeholder="06 XX XX XX XX" inputmode="tel" autocomplete="tel">
      </div>
      <div class="field">
        <label>Adresse de livraison *</label>
        <input id="c-adr" type="text" placeholder="12 rue des Lilas, 65000 Tarbes" autocomplete="street-address">
      </div>
      <div class="field">
        <label>Note (optionnel)</label>
        <input id="c-note" type="text" placeholder="Code porte, étage, sonnette…">
      </div>
    </div>
    <!-- Paiement -->
    <div>
      <div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:7px">Paiement à la livraison</div>
      <div class="pay-opts">
        <button class="pay-opt on" data-mode="Espèces 💵" onclick="setMode(this)"><i class="ti ti-cash"></i>Espèces</button>
        <button class="pay-opt" data-mode="Carte 💳" onclick="setMode(this)"><i class="ti ti-credit-card"></i>Carte</button>
        <button class="pay-opt" data-mode="Virement 🏦" onclick="setMode(this)"><i class="ti ti-building-bank"></i>Virement</button>
      </div>
    </div>
    <button class="btn-order" id="btn-order" onclick="commander()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      Commander via WhatsApp
    </button>
    <div id="order-err" style="color:#ef4444;font-size:11px;text-align:center;min-height:14px"></div>
  </div>
</div>

// ─── STATE ────────────────────────────────────────────────────────────────────
let cart = [], activeCat = 'Tous', payMode = 'Espèces 💵'

const getTotal = () => cart.reduce((s,x)=>s+x.prix*x.qty,0)
const getNb = () => cart.reduce((s,x)=>s+x.qty,0)

// ─── CATALOGUE ────────────────────────────────────────────────────────────────
function renderCats() {
  const cats = ['Tous',...CATS.map(c=>c.nom)]
  document.getElementById('cats-bar').innerHTML = cats.map(c=>`
    <button class="cat-chip${c===activeCat?' active':''}" onclick="setCat('${c.replace(/'/g,"\\'")}')">
      ${CATS.find(x=>x.nom===c)?.ico||''} ${c}
    </button>`).join('')
}

function setCat(cat) { activeCat=cat; renderCats(); renderProds() }

function renderProds() {
  const filtered = PRODS.filter(p => activeCat==='Tous' || CATS.find(c=>c.id===p.cat)?.nom===activeCat)
  const container = document.getElementById('catalogue')
  if (activeCat==='Tous') {
    const groups={}
    filtered.forEach(p=>{const cn=CATS.find(c=>c.id===p.cat)?.nom||'Autre';if(!groups[cn])groups[cn]=[];groups[cn].push(p)})
    container.innerHTML = Object.entries(groups).map(([cat,prods])=>`
      <div class="cat-section">
        <div class="cat-title">${CATS.find(c=>c.nom===cat)?.ico||'📦'} ${cat}</div>
        <div class="prod-grid">${prods.map(prodCard).join('')}</div>
      </div>`).join('')
  } else {
    container.innerHTML = `<div class="prod-grid">${filtered.map(prodCard).join('')}</div>`
  }
}

function prodCard(p) {
  const inC = cart.find(x=>x.id===p.id)
  return `<div class="prod-card${inC?' in-cart':''}" onclick="addToCart(${p.id},this)">
    ${inC?`<div class="qty-badge">${inC.qty}</div>`:''}
    <div class="prod-ico">${p.ico}</div>
    <div class="prod-nom">${p.nom}</div>
    <div class="prod-prix">${p.prix.toFixed(2)} €</div>
  </div>`
}

// ─── PANIER ───────────────────────────────────────────────────────────────────
function addToCart(id, el) {
  const p = PRODS.find(x=>x.id===id)
  if (!p) return
  const ex = cart.find(x=>x.id===id)
  ex ? ex.qty++ : cart.push({id:p.id,nom:p.nom,prix:p.prix,qty:1,ico:p.ico})
  el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'),250)
  if (navigator.vibrate) navigator.vibrate(30)
  updateFab(); renderProds()
}

function removeFromCart(id) { cart=cart.filter(x=>x.id!==id); updateFab(); renderCartItems(); renderProds() }
function changeQty(id,d) {
  const item=cart.find(x=>x.id===id)
  if(!item) return
  item.qty+=d
  if(item.qty<=0) return removeFromCart(id)
  updateFab(); renderCartItems()
}
function clearCart() { cart=[]; updateFab(); renderCartItems(); renderProds() }

function updateFab() {
  const n=getNb(), total=getTotal()
  const btn = document.getElementById('cart-btn')
  if(n>0) {
    btn.style.display='flex'
    document.getElementById('cart-btn-label').textContent = n
    document.getElementById('cart-btn-total').textContent = total.toFixed(2)+' €'
    document.getElementById('total-val').textContent = total.toFixed(2)+' €'
    document.getElementById('btn-order-total') && (document.getElementById('btn-order-total').textContent = total.toFixed(2)+' €')
  } else btn.style.display='none'
}

function renderCartItems() {
  const el = document.getElementById('sheet-body')
  if(!cart.length) { el.innerHTML=`<div class="empty-cart"><i class="ti ti-shopping-cart-off"></i><span>Panier vide</span></div>`; return }
  el.innerHTML = cart.map(item=>`
    <div class="cart-item">
      <span class="ci-ico">${item.ico}</span>
      <div class="ci-info"><div class="ci-nom">${item.nom}</div><div class="ci-pu">${item.prix.toFixed(2)} €/u</div></div>
      <div class="ci-ctrl">
        <button class="qbtn" onclick="changeQty(${item.id},-1)">−</button>
        <span class="qnum">${item.qty}</span>
        <button class="qbtn" onclick="changeQty(${item.id},1)">+</button>
      </div>
      <div class="ci-tot">${(item.prix*item.qty).toFixed(2)} €</div>
    </div>`).join('')
}

function openSheet() { renderCartItems(); document.getElementById('overlay').classList.add('open'); document.getElementById('sheet').classList.add('open') }
function closeSheet() { document.getElementById('overlay').classList.remove('open'); document.getElementById('sheet').classList.remove('open') }
function setMode(btn) { payMode=btn.dataset.mode; document.querySelectorAll('.pay-opt').forEach(b=>b.classList.toggle('on',b===btn)) }

// ─── COMMANDER VIA WHATSAPP ───────────────────────────────────────────────────
function commander() {
  const nom = document.getElementById('c-nom').value.trim()
  const tel = document.getElementById('c-tel').value.trim()
  const adr = document.getElementById('c-adr').value.trim()
  const note = document.getElementById('c-note').value.trim()
  const err = document.getElementById('order-err')
  err.textContent = ''
  if (!nom) { err.textContent = '⚠ Prénom requis'; return }
  if (!tel || tel.length < 8) { err.textContent = '⚠ Téléphone invalide'; return }
  if (!adr) { err.textContent = '⚠ Adresse requise'; return }
  if (!cart.length) { err.textContent = '⚠ Panier vide'; return }

  const total = getTotal()
  const heure = new Date().toLocaleTimeString('fr', {hour:'2-digit',minute:'2-digit'})
  const date = new Date().toLocaleDateString('fr')

  // Construire le message WhatsApp
  const lignes = cart.map(x=>`  • ${x.ico} ${x.nom} x${x.qty} = ${(x.prix*x.qty).toFixed(2)}€`).join('\n')
  const msg = `🧃 *NOUVELLE COMMANDE FreshCorner*
━━━━━━━━━━━━━━━━━
📅 ${date} à ${heure}
👤 *${nom}*
📱 ${tel}
📍 ${adr}${note ? `\n📝 ${note}` : ''}
━━━━━━━━━━━━━━━━━
*ARTICLES :*
${lignes}
━━━━━━━━━━━━━━━━━
💰 *TOTAL : ${total.toFixed(2)} €*
💳 Paiement : ${payMode}
━━━━━━━━━━━━━━━━━`

  // Ouvrir WhatsApp
  const url = `https://wa.me/${LIVREUR_WHATSAPP}?text=${encodeURIComponent(msg)}`
  window.open(url, '_blank')

  // Afficher la confirmation
  closeSheet()
  document.getElementById('page-catalogue').style.display = 'none'
  const confirm = document.getElementById('page-confirm')
  confirm.classList.add('active')
  document.getElementById('confirm-recap').innerHTML = `
    <div class="confirm-row"><span>Client</span><span>${nom}</span></div>
    <div class="confirm-row"><span>Téléphone</span><span>${tel}</span></div>
    <div class="confirm-row"><span>Adresse</span><span>${adr}</span></div>
    <div class="confirm-row"><span>Articles</span><span>${getNb()} article${getNb()>1?'s':''}</span></div>
    <div class="confirm-row"><span>Paiement</span><span>${payMode}</span></div>
    <div class="confirm-row"><span>Total</span><span class="confirm-total">${total.toFixed(2)} €</span></div>`

  cart = []; updateFab()
}

function resetCommande() {
  document.getElementById('page-catalogue').style.display = 'block'
  document.getElementById('page-confirm').classList.remove('active')
  renderProds()
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
renderCats()
renderProds()
</script>
